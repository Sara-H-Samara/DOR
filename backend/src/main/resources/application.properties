spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/dor
spring.datasource.username=dor_user
spring.datasource.password=dor_pass

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
server.error.include-message=alwayss
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
dor.seed.admin-password=${ADMIN_PASSWORD:admin12345}
dor.seed.staff-password=${STAFF_PASSWORD:staff12345}